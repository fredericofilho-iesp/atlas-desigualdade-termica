name: Sonda (temporária)
on:
  push:
    branches: [amplitude-gini]
    paths: [.github/workflows/sonda.yml]
jobs:
  sonda:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          set +e
          B=https://sidra.ibge.gov.br/pesquisa/censo-demografico/demografico-2022
          curl -sL -m 60 $B > raiz.html; echo "raiz $(wc -c < raiz.html) bytes"
          grep -o 'demografico-2022/[a-z0-9-]*' raiz.html | sort -u | tee subs.txt
          for s in $(cat subs.txt); do
            curl -sL -m 60 "https://sidra.ibge.gov.br/pesquisa/censo-demografico/$s" > p.html
            if grep -qi gini p.html; then echo "### GINI em $s"; grep -io '<a[^>]*tabela/[0-9]*[^<]*</a>\|Tabela [0-9]* - [^<]*' p.html | grep -i -B0 -A0 "gini\|rendimento" | head -20; fi
          done
          for t in 10295 10296 10297 10298 10299 10300 10301 10302 10303 10304 10305; do
            curl -s -m 30 "https://apisidra.ibge.gov.br/desctabapi.aspx?c=$t" | grep -o '<span id="lblNomeTabela"[^<]*' | sed "s/^/$t /"
          done

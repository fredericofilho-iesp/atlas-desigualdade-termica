name: Preparar malha censitária IBGE 2022
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Dependências do sistema
        run: sudo apt-get update && sudo apt-get install -y libgdal-dev libgeos-dev libproj-dev libudunits2-dev
      - name: Pacotes R
        run: Rscript -e 'install.packages(c("sf","dplyr","jsonlite"), repos="https://cloud.r-project.org")'
      - name: Gerar malha GeoJSON
        run: Rscript R/01_importar_ibge.R
      - name: Registrar dados processados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/processados/rio_setores_2022.geojson dados/processados/metadados_setores.json
          git commit -m "Add IBGE 2022 Rio census sectors geometry" || echo "Sem mudanças"
          git push

name: Preparar camadas do atlas
# Executar manualmente: aba Actions → "Preparar camadas do atlas" → Run workflow.
# Gera dados/processados/<escala>/{unidades.geojson, camada.json} e
# dados/indicadores/<escala>/ (tabelas de indicadores), e faz commit.
on:
  workflow_dispatch:
    inputs:
      escala:
        description: "Qual camada gerar"
        type: choice
        default: todas
        options: [todas, rio, estado-rj, temperatura-rio, renda-rio, arborizacao-rio, demografia-rio, estado-rj-teste, estado-rj-completo, estado-rj-municipios, brasil-teste, brasil-completo, brasil-municipios, latam-teste, latam-completo, latam-renda, bivariados, estado-rj-calor-extremo, calor-brasil-latam, contornos, amplitude-gini]
permissions:
  contents: write
concurrency:
  group: preparar-camadas
  cancel-in-progress: false
jobs:
  preparar:
    # Versão fixa: os binários de pacotes R (Posit Package Manager) existem
    # para o Ubuntu 24.04; numa versão nova tudo é compilado e passa de 45 min.
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Dependências do sistema
        run: sudo apt-get update && sudo apt-get install -y libgdal-dev libgeos-dev libproj-dev libudunits2-dev
      - name: Pacotes R
        # Sem `repos=`: usa o repositório de binários configurado por setup-r
        # (use-public-rspm). Apontar para o CRAN força compilação do código-fonte.
        run: Rscript -e 'install.packages(c("sf","dplyr","jsonlite","geobr","terra","rstac","exactextractr","readxl","foreign"))'
      - name: Setores censitários — município do Rio
        if: inputs.escala == 'todas' || inputs.escala == 'rio'
        run: Rscript R/01_importar_ibge.R
      - name: Municípios — estado do RJ
        if: inputs.escala == 'todas' || inputs.escala == 'estado-rj'
        run: Rscript R/02_importar_municipios_rj.R
      - name: Temperatura da superfície no verão — município do Rio (Landsat)
        if: inputs.escala == 'todas' || inputs.escala == 'temperatura-rio'
        run: Rscript R/03_temperatura_superficie_rio.R
      - name: Renda do responsável e calor × renda — município do Rio
        if: inputs.escala == 'todas' || inputs.escala == 'renda-rio'
        run: |
          Rscript R/04_renda_rio.R
          Rscript R/05_calor_renda_rio.R
      - name: Arborização do entorno — município do Rio
        if: inputs.escala == 'todas' || inputs.escala == 'arborizacao-rio'
        run: Rscript R/06_arborizacao_rio.R
      - name: Idade e cor ou raça — município do Rio
        if: inputs.escala == 'todas' || inputs.escala == 'demografia-rio'
        run: Rscript R/07_demografia_rio.R
      - name: Estado do RJ — setores e temperatura (teste com 8 cenas)
        if: inputs.escala == 'estado-rj-teste'
        env:
          LIMITE_CENAS: "8"
        run: |
          Rscript R/11_setores_estado_rj.R
          Rscript R/12_lst_estado_rj.R
      - name: Estado do RJ — setores, temperatura, Censo e municípios
        if: inputs.escala == 'estado-rj-completo'
        run: |
          Rscript R/11_setores_estado_rj.R
          Rscript R/13_censo_estado_rj.R
          Rscript R/12_lst_estado_rj.R
          Rscript R/14_municipios_rj.R
      - name: Estado do RJ — só Censo e municípios (usa a temperatura já salva)
        if: inputs.escala == 'estado-rj-municipios'
        run: |
          Rscript R/13_censo_estado_rj.R
          Rscript R/14_municipios_rj.R
      - name: Brasil — teste (RJ e ES, poucos compostos MODIS)
        if: inputs.escala == 'brasil-teste'
        env:
          UFS: RJ,ES
          LIMITE_COMPOSTOS: "40"
        run: |
          Rscript R/20_censo_brasil.R
          Rscript R/21_lst_modis_brasil.R
          Rscript R/22_municipios_brasil.R
      - name: Brasil — completo (Censo, MODIS, municípios)
        if: inputs.escala == 'brasil-completo'
        run: |
          Rscript R/20_censo_brasil.R
          Rscript R/21_lst_modis_brasil.R
          Rscript R/22_municipios_brasil.R
      - name: Brasil — só indicadores municipais (reaproveita Censo e MODIS salvos)
        if: inputs.escala == 'brasil-municipios'
        run: Rscript R/22_municipios_brasil.R
      - name: América Latina — teste (Uruguai, Paraguai, Costa Rica; poucos compostos MODIS)
        if: inputs.escala == 'latam-teste'
        env:
          PAISES: URY,PRY,CRI
          LIMITE_COMPOSTOS: "40"
        run: |
          Rscript R/30_unidades_latam.R
          Rscript R/31_latam.R
      - uses: actions/setup-python@v5
        if: inputs.escala == 'estado-rj-calor-extremo'
        with:
          python-version: "3.12"
      - name: Estado do RJ — calor extremo (ERA5-Land via Open-Meteo, sem conta)
        if: inputs.escala == 'estado-rj-calor-extremo'
        run: |
          pip install --quiet omfiles fsspec s3fs numpy netCDF4
          python ferramentas/baixar_openmeteo.py --saida dados/brutos/era5land/rj --anos 2016-2025 --area -20.6 -45.0 -23.5 -40.8
          Rscript R/11_setores_estado_rj.R
          Rscript R/16_calor_extremo_rj.R
      - uses: actions/setup-python@v5
        if: inputs.escala == 'calor-brasil-latam'
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4
        if: inputs.escala == 'calor-brasil-latam'
        with:
          path: dados/brutos/era5land/latam_metricas.tif
          key: era5land-latam-2016-2025
      - name: Brasil e América Latina — calor extremo (ERA5-Land via Open-Meteo)
        if: inputs.escala == 'calor-brasil-latam'
        run: |
          pip install --quiet omfiles fsspec s3fs numpy rasterio
          python ferramentas/calor_grade_openmeteo.py --saida dados/brutos/era5land/latam_metricas.tif --anos 2016-2025 --area 33 -118 -56 -34
      - uses: actions/cache/save@v4
        if: always() && inputs.escala == 'calor-brasil-latam' && hashFiles('dados/brutos/era5land/latam_metricas.tif') != ''
        with:
          path: dados/brutos/era5land/latam_metricas.tif
          key: era5land-latam-2016-2025
      - name: Brasil e América Latina — indicadores de calor extremo
        if: inputs.escala == 'calor-brasil-latam'
        run: Rscript R/50_calor_extremo_brasil_latam.R
      - name: Limites de estados e países (linhas por cima das unidades)
        if: inputs.escala == 'contornos'
        run: Rscript R/60_contornos.R
      - name: Desigualdade térmica interna e Gini entre setores (Rio por bairro, estado do RJ, Brasil)
        if: inputs.escala == 'amplitude-gini'
        run: |
          Rscript R/01_importar_ibge.R
          Rscript R/42_amplitude_gini.R
      - name: Mapas bivariados (Rio, estado do RJ, Brasil)
        if: inputs.escala == 'bivariados'
        env:
          ESCALAS: ${{ vars.ESCALAS_BIVARIADOS || 'rio,estado-rj,brasil' }}
        run: |
          Rscript R/01_importar_ibge.R
          Rscript R/40_bivariados.R
      - uses: actions/cache/restore@v4
        # tiles MODIS já processados (só da rodada completa; o teste usa menos compostos)
        if: inputs.escala == 'latam-completo' || inputs.escala == 'latam-renda'
        with:
          path: dados/brutos/modis-latam
          key: modis-latam-2022-2024
          restore-keys: modis-latam-2022-2024-
      - name: América Latina — completo
        if: inputs.escala == 'latam-completo'
        run: |
          Rscript R/30_unidades_latam.R
          Rscript R/31_latam.R
      - uses: actions/setup-python@v5
        if: inputs.escala == 'latam-renda'
        with:
          python-version: "3.12"
      - name: América Latina — downloads dos censos (México e Colômbia)
        if: inputs.escala == 'latam-renda'
        run: |
          mkdir -p dados/brutos/mex dados/brutos/col
          curl -sSfL --retry 3 -o dados/brutos/mex/IMU_2020.zip https://conapo.segob.gob.mx/work/models/CONAPO/Datos_Abiertos/Marginacion/IMU_2020.zip
          unzip -o -q dados/brutos/mex/IMU_2020.zip -d dados/brutos/mex
          curl -sSfL --retry 3 -o dados/brutos/col/SHP_VULNRB_IPMxMZ.zip https://www.dane.gov.co/files/geoportal-provisional/SHP_VULNRB_IPMxMZ.zip
          curl -sSfL --retry 3 -o dados/brutos/col/SHP_MGN2018_INTGRD_MANZ.zip https://www.dane.gov.co/files/geoportal-provisional/SHP_MGN2018_INTGRD_MANZ.zip
          pip install -q playwright && python -m playwright install --with-deps chromium > /dev/null
          python ferramentas/baixar_inegi.py dados/brutos/mex
          ls -la dados/brutos/mex dados/brutos/col
      - name: América Latina — desigualdade por renda dentro das cidades
        if: inputs.escala == 'latam-renda'
        run: Rscript R/33_renda_latam.R
      - uses: actions/cache/save@v4
        if: always() && (inputs.escala == 'latam-completo' || inputs.escala == 'latam-renda') && hashFiles('dados/brutos/modis-latam/*.tif') != ''
        with:
          path: dados/brutos/modis-latam
          key: modis-latam-2022-2024-${{ github.run_id }}
      - name: Registrar dados processados
        if: always()   # guarda o que já foi calculado mesmo se um passo posterior falhar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/processados dados/indicadores
          git commit -m "Atualiza camadas processadas (${{ inputs.escala }})" || echo "Sem mudanças"
          git pull --rebase || true
          git push
